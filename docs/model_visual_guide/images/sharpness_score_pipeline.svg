<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
  <defs>
    <marker id="arr-sharp" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.t{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:25px;font-weight:700}.b{font-size:18px}.s{font-size:14px}.box{stroke:#334155;stroke-width:2;rx:14}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arr-sharp)}</style>
  </defs>
  <rect width="1200" height="690" fill="#f8fafc"/>
  <text class="t h" x="600" y="38" text-anchor="middle">Sharpness: từ một GMM đến S68 và S95</text>

  <rect class="box" x="35" y="90" width="220" height="115" fill="#dbeafe"/>
  <text class="t b" x="145" y="127" text-anchor="middle">Một pedestrian</text>
  <text class="t s" x="145" y="158" text-anchor="middle">một horizon</text>
  <text class="t s" x="145" y="184" text-anchor="middle">một GMM</text>
  <path class="arrow" d="M255 148 H320"/>

  <rect class="box" x="320" y="75" width="250" height="145" fill="#e0e7ff"/>
  <text class="t b" x="445" y="112" text-anchor="middle">Grid 361 × 361</text>
  <text class="t s" x="445" y="143" text-anchor="middle">130,321 điểm z</text>
  <text class="t s" x="445" y="171" text-anchor="middle">tính C(z) cho mỗi điểm</text>
  <text class="t s" x="445" y="199" text-anchor="middle">bằng 1000 MC samples</text>
  <path class="arrow" d="M570 148 H635"/>

  <rect class="box" x="635" y="70" width="250" height="155" fill="#fef3c7"/>
  <text class="t b" x="760" y="106" text-anchor="middle">Tạo confidence region</text>
  <text class="t s" x="760" y="143" text-anchor="middle">C(z) ≤ 0.68 → vùng 68%</text>
  <text class="t s" x="760" y="174" text-anchor="middle">C(z) ≤ 0.95 → vùng 95%</text>
  <text class="t s" x="760" y="204" text-anchor="middle">vùng 68% ⊂ vùng 95%</text>
  <path class="arrow" d="M885 148 H950"/>

  <rect class="box" x="950" y="90" width="215" height="115" fill="#dcfce7"/>
  <text class="t b" x="1057" y="128" text-anchor="middle">Ước lượng diện tích</text>
  <text class="t s" x="1057" y="161" text-anchor="middle">Area68, Area95</text>
  <text class="t s" x="1057" y="188" text-anchor="middle">đơn vị m²</text>

  <path class="arrow" d="M1057 205 V285 H895"/>
  <rect class="box" x="650" y="285" width="490" height="145" fill="#fae8ff"/>
  <text class="t b" x="895" y="323" text-anchor="middle">Lặp cho toàn dataset và 6 horizons</text>
  <text class="t s" x="895" y="355" text-anchor="middle">data shape = [N pedestrian, 2 levels, 6 horizons]</text>
  <text class="t s" x="895" y="385" text-anchor="middle">tính percentile diện tích tại mỗi horizon</text>
  <text class="t s" x="895" y="413" text-anchor="middle">đường median + vùng percentile 25–75%</text>

  <path class="arrow" d="M650 357 H565"/>
  <rect class="box" x="305" y="285" width="260" height="145" fill="#fee2e2"/>
  <text class="t b" x="435" y="323" text-anchor="middle">Chuẩn hóa theo thời gian</text>
  <text class="t s" x="435" y="357" text-anchor="middle">Areaκ,t / time_t</text>
  <text class="t s" x="435" y="386" text-anchor="middle">cộng 6 horizon</text>
  <text class="t s" x="435" y="413" text-anchor="middle">chia 48 × 0.1 = 4.8</text>

  <path class="arrow" d="M305 357 H220"/>
  <rect class="box" x="35" y="290" width="185" height="135" fill="#ccfbf1"/>
  <text class="t h" x="127" y="340" text-anchor="middle" fill="#0f766e">S68</text>
  <text class="t h" x="127" y="390" text-anchor="middle" fill="#7c3aed">S95</text>

  <rect class="box" x="75" y="500" width="1050" height="135" fill="#ffffff"/>
  <text class="t b" x="600" y="538" text-anchor="middle">Cách đọc đúng</text>
  <text class="t s" x="600" y="574" text-anchor="middle">Reliability tốt trước: vùng 68% và 95% bao phủ đúng tỷ lệ ground truth</text>
  <text class="t s" x="600" y="606" text-anchor="middle">Sau đó S68/S95 càng nhỏ: vùng dự đoán càng tập trung, model càng sharp</text>
  <text class="t b" x="600" y="667" text-anchor="middle">Sharpness nhỏ mà reliability kém có thể chỉ là model quá tự tin.</text>
</svg>
