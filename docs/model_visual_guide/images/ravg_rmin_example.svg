<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="arr-rls" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.t{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:26px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.box{stroke:#334155;stroke-width:2;rx:14}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arr-rls)}</style>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text class="t h" x="600" y="42" text-anchor="middle">Ravg lấy trung bình — Rmin nhìn điểm calibration tệ nhất</text>

  <rect class="box" x="45" y="90" width="470" height="390" fill="#ffffff"/>
  <text class="t b" x="280" y="128" text-anchor="middle">Bảng calibration error = |coverage − κ|</text>
  <text class="t s" x="85" y="185">Horizon</text><text class="t s" x="220" y="185">κ=0.2</text><text class="t s" x="320" y="185">κ=0.5</text><text class="t s" x="420" y="185">κ=0.8</text>
  <line x1="75" y1="200" x2="485" y2="200" stroke="#cbd5e1" stroke-width="2"/>
  <text class="t b" x="85" y="250">0.8s</text><text class="t b" x="225" y="250">0.02</text><text class="t b" x="325" y="250">0.10</text><text class="t b" x="425" y="250">0.05</text>
  <text class="t b" x="85" y="315">1.6s</text><text class="t b" x="225" y="315">0.04</text><rect x="300" y="280" width="85" height="52" rx="8" fill="#fecaca"/><text class="t b" x="325" y="315" fill="#b91c1c">0.20</text><text class="t b" x="425" y="315">0.08</text>
  <line x1="75" y1="350" x2="485" y2="350" stroke="#cbd5e1" stroke-width="2"/>
  <text class="t s" x="280" y="393" text-anchor="middle">Trung bình 6 lỗi = 0.08167</text>
  <text class="t s" x="280" y="430" text-anchor="middle" fill="#b91c1c">Lỗi lớn nhất = 0.20</text>

  <path class="arrow" d="M515 245 H635"/>
  <path class="arrow" d="M515 390 C570 390 580 515 635 515"/>

  <rect class="box" x="635" y="120" width="500" height="210" fill="#dcfce7"/>
  <text class="t h" x="885" y="165" text-anchor="middle" fill="#15803d">Ravg</text>
  <text class="t b" x="885" y="210" text-anchor="middle">(1 − mean tất cả error) × 100</text>
  <text class="t b" x="885" y="250" text-anchor="middle">(1 − 0.08167) × 100</text>
  <text class="t h" x="885" y="300" text-anchor="middle" fill="#15803d">= 91.83%</text>

  <rect class="box" x="635" y="405" width="500" height="190" fill="#fee2e2"/>
  <text class="t h" x="885" y="448" text-anchor="middle" fill="#b91c1c">Rmin</text>
  <text class="t b" x="885" y="490" text-anchor="middle">(1 − max error) × 100</text>
  <text class="t b" x="885" y="528" text-anchor="middle">(1 − 0.20) × 100</text>
  <text class="t h" x="885" y="572" text-anchor="middle" fill="#b91c1c">= 80%</text>

  <text class="t b" x="600" y="630" text-anchor="middle">Rmin ≤ Ravg · Cả hai càng gần 100% càng tốt</text>
</svg>
