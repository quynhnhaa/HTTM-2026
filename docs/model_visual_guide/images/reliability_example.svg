<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="580" viewBox="0 0 1050 580">
  <style>.t{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:26px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.axis{stroke:#334155;stroke-width:2}.grid{stroke:#cbd5e1;stroke-width:1}.ideal{stroke:#111827;stroke-width:3;stroke-dasharray:10 8}.good{stroke:#16a34a;stroke-width:4;fill:none}.bad{stroke:#dc2626;stroke-width:4;fill:none}</style>
  <rect width="1050" height="580" fill="#f8fafc"/><text class="t h" x="525" y="42" text-anchor="middle">Reliability: confidence danh nghĩa và coverage thực tế</text>
  <line class="axis" x1="110" y1="470" x2="650" y2="470"/><line class="axis" x1="110" y1="470" x2="110" y2="80"/>
  <g class="grid"><line x1="110" y1="275" x2="650" y2="275"/><line x1="380" y1="80" x2="380" y2="470"/><line x1="650" y1="80" x2="650" y2="470"/></g>
  <line class="ideal" x1="110" y1="470" x2="650" y2="80"/><polyline class="good" points="110,470 245,380 380,275 515,174 650,80"/><polyline class="bad" points="110,470 245,340 380,197 515,135 650,80"/>
  <circle cx="380" cy="275" r="8" fill="#16a34a"/><circle cx="380" cy="197" r="8" fill="#dc2626"/><line x1="380" y1="197" x2="380" y2="275" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 5"/>
  <text class="t s" x="95" y="490">0</text><text class="t s" x="370" y="495">0.5</text><text class="t s" x="640" y="495">1.0</text><text class="t s" x="70" y="477">0</text><text class="t s" x="70" y="280">0.5</text><text class="t s" x="70" y="86">1.0</text>
  <text class="t b" x="380" y="540" text-anchor="middle">κ — confidence level</text><text class="t b" transform="translate(28 290) rotate(-90)" text-anchor="middle">P(C ≤ κ) — coverage thực tế</text>
  <line x1="730" y1="120" x2="790" y2="120" class="ideal"/><text class="t b" x="810" y="127">Lý tưởng: y = x</text><line x1="730" y1="180" x2="790" y2="180" class="good"/><text class="t b" x="810" y="187">5/10 ≤ 0.5</text><line x1="730" y1="240" x2="790" y2="240" class="bad"/><text class="t b" x="810" y="247">7/10 ≤ 0.5</text>
  <rect x="710" y="310" width="300" height="125" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text class="t b" x="735" y="350">Tại κ = 0.5:</text><text class="t b" x="735" y="386" fill="#16a34a">lý tưởng: |0.5 − 0.5| = 0</text><text class="t b" x="735" y="420" fill="#dc2626">lệch: |0.7 − 0.5| = 0.2</text>
</svg>
