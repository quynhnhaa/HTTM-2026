<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="arrow-conf" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.t{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:26px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.box{stroke:#334155;stroke-width:2;rx:14}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow-conf)}</style>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text class="t h" x="600" y="40" text-anchor="middle">build_confidence_set_mdn(): từ GMM đến confidence của target</text>

  <rect class="box" x="35" y="100" width="220" height="100" fill="#dbeafe"/>
  <text class="t b" x="145" y="137" text-anchor="middle">output</text>
  <text class="t b" x="145" y="170" text-anchor="middle">[B, 6, 18]</text>
  <path class="line" d="M255 150 H325"/>

  <rect class="box" x="325" y="85" width="235" height="130" fill="#e0e7ff"/>
  <text class="t b" x="442" y="124" text-anchor="middle">Dựng GMM</text>
  <text class="t s" x="442" y="154" text-anchor="middle">B × 6 phân phối</text>
  <text class="t s" x="442" y="181" text-anchor="middle">mỗi GMM có 3 Gaussian</text>

  <path class="line" d="M560 120 C630 120 620 90 690 90"/>
  <path class="line" d="M560 180 C630 180 620 260 690 260"/>

  <rect class="box" x="690" y="50" width="270" height="90" fill="#fef3c7"/>
  <text class="t b" x="825" y="86" text-anchor="middle">Tính mật độ target</text>
  <text class="t s" x="825" y="116" text-anchor="middle">gt_log_prob: [B, 6]</text>

  <rect class="box" x="690" y="205" width="270" height="115" fill="#dcfce7"/>
  <text class="t b" x="825" y="240" text-anchor="middle">Lấy 1000 mẫu / GMM</text>
  <text class="t s" x="825" y="270" text-anchor="middle">samples: [1000, B, 6, 2]</text>
  <text class="t s" x="825" y="297" text-anchor="middle">log_prob: [1000, B, 6]</text>

  <path class="line" d="M825 140 V180 C825 180 1030 180 1030 350"/>
  <path class="line" d="M825 320 V350"/>

  <rect class="box" x="885" y="350" width="290" height="105" fill="#fee2e2"/>
  <text class="t b" x="1030" y="386" text-anchor="middle">So sánh mật độ</text>
  <text class="t s" x="1030" y="416" text-anchor="middle">1 nếu p(sample) &gt; p(target)</text>
  <text class="t s" x="1030" y="442" text-anchor="middle">idx_mask: [1000, B, 6]</text>

  <path class="line" d="M1030 455 V505 H825"/>
  <rect class="box" x="640" y="505" width="370" height="105" fill="#fae8ff"/>
  <text class="t b" x="825" y="541" text-anchor="middle">Cộng 1000 mask rồi chia 1000</text>
  <text class="t b" x="825" y="574" text-anchor="middle">conf: [B, 6]</text>
  <text class="t s" x="825" y="598" text-anchor="middle">tỷ lệ sample có mật độ cao hơn target</text>

  <rect class="box" x="40" y="300" width="485" height="250" fill="#ffffff"/>
  <text class="t b" x="282" y="335" text-anchor="middle">Ví dụ 5 mẫu, p(target) = 0.12</text>
  <text class="t s" x="85" y="380">p(sample)</text><text class="t s" x="255" y="380">So với 0.12</text><text class="t s" x="420" y="380">mask</text>
  <text class="t b" x="100" y="420">0.40</text><text class="t b" x="285" y="420">cao hơn</text><text class="t b" x="435" y="420" fill="#16a34a">1</text>
  <text class="t b" x="100" y="455">0.20</text><text class="t b" x="285" y="455">cao hơn</text><text class="t b" x="435" y="455" fill="#16a34a">1</text>
  <text class="t b" x="100" y="490">0.10</text><text class="t b" x="285" y="490">thấp hơn</text><text class="t b" x="435" y="490" fill="#dc2626">0</text>
  <text class="t b" x="100" y="525">0.05</text><text class="t b" x="285" y="525">thấp hơn</text><text class="t b" x="435" y="525" fill="#dc2626">0</text>
  <text class="t b" x="100" y="560">0.30</text><text class="t b" x="285" y="560">cao hơn</text><text class="t b" x="435" y="560" fill="#16a34a">1</text>
  <text class="t b" x="282" y="605" text-anchor="middle">conf = 3 / 5 = 0.6</text>

  <text class="t s" x="600" y="635" text-anchor="middle">conf nhỏ: target ở vùng mật độ cao · conf lớn: target ở vùng đuôi</text>
</svg>
