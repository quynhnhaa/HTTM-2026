<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540">
  <style>.t{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:26px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.axis{stroke:#64748b;stroke-width:2}.gt{stroke:#111827;stroke-width:4;fill:none}.a{stroke:#2563eb;stroke-width:4;fill:none}.bb{stroke:#ea580c;stroke-width:4;fill:none}.dash{stroke-dasharray:6 5;stroke-width:2}</style>
  <rect width="1100" height="540" fill="#f8fafc"/><text class="t h" x="550" y="40" text-anchor="middle">minADE và minFDE có thể chọn hai mẫu khác nhau</text>
  <line class="axis" x1="70" y1="390" x2="650" y2="390"/><line class="axis" x1="70" y1="390" x2="70" y2="90"/>
  <polyline class="gt" points="100,350 260,290 430,220 610,130"/><polyline class="a" points="100,350 260,280 430,240 610,235"/><polyline class="bb" points="100,350 260,365 430,300 610,175"/>
  <circle cx="610" cy="130" r="7" fill="#111827"/><circle cx="610" cy="235" r="7" fill="#2563eb"/><circle cx="610" cy="175" r="7" fill="#ea580c"/>
  <line class="dash" x1="610" y1="130" x2="610" y2="235" stroke="#2563eb"/><line class="dash" x1="625" y1="130" x2="625" y2="175" stroke="#ea580c"/>
  <text class="t s" x="105" y="420">t₁</text><text class="t s" x="260" y="420">t₂</text><text class="t s" x="430" y="420">t₃</text><text class="t s" x="600" y="420">t cuối</text>
  <line x1="760" y1="110" x2="810" y2="110" class="gt"/><text class="t b" x="825" y="117">Ground truth</text><line x1="760" y1="160" x2="810" y2="160" class="a"/><text class="t b" x="825" y="167">Mẫu A</text><line x1="760" y1="210" x2="810" y2="210" class="bb"/><text class="t b" x="825" y="217">Mẫu B</text>
  <rect x="720" y="270" width="330" height="185" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text class="t b" x="745" y="306">Sai số A: 0.2, 0.4, 1.0 m</text><text class="t b" x="745" y="342">Sai số B: 0.8, 0.7, 0.6 m</text><text class="t b" x="745" y="390" fill="#2563eb">minADE2 = 0.533 m → mẫu A</text><text class="t b" x="745" y="426" fill="#ea580c">minFDE2 = 0.600 m → mẫu B</text>
  <text class="t s" x="550" y="505" text-anchor="middle">ADE xét trung bình mọi mốc; FDE chỉ xét mốc cuối.</text>
</svg>
