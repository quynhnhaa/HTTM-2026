<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <marker id="arr-cal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.t{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:25px;font-weight:700}.b{font-size:18px}.s{font-size:14px}.box{stroke:#334155;stroke-width:2;rx:12}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arr-cal)}</style>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text class="t h" x="600" y="38" text-anchor="middle">Từ ground truth z đến empirical coverage tại κ = 0.5</text>

  <rect class="box" x="35" y="75" width="260" height="535" fill="#eff6ff"/>
  <text class="t b" x="165" y="108" text-anchor="middle">10 pedestrian tại 2.4s</text>
  <text class="t s" x="165" y="140" text-anchor="middle">mỗi người có GMM và z riêng</text>
  <g class="t s">
    <text x="60" y="185">GMM₁ + z₁</text><text x="190" y="185">C(z₁)=0.05</text>
    <text x="60" y="225">GMM₂ + z₂</text><text x="190" y="225">C(z₂)=0.12</text>
    <text x="60" y="265">GMM₃ + z₃</text><text x="190" y="265">C(z₃)=0.18</text>
    <text x="60" y="305">GMM₄ + z₄</text><text x="190" y="305">C(z₄)=0.31</text>
    <text x="60" y="345">GMM₅ + z₅</text><text x="190" y="345">C(z₅)=0.42</text>
    <text x="60" y="385">GMM₆ + z₆</text><text x="190" y="385">C(z₆)=0.54</text>
    <text x="60" y="425">GMM₇ + z₇</text><text x="190" y="425">C(z₇)=0.62</text>
    <text x="60" y="465">GMM₈ + z₈</text><text x="190" y="465">C(z₈)=0.76</text>
    <text x="60" y="505">GMM₉ + z₉</text><text x="190" y="505">C(z₉)=0.88</text>
    <text x="60" y="545">GMM₁₀ + z₁₀</text><text x="190" y="545">C(z₁₀)=0.96</text>
  </g>
  <text class="t s" x="165" y="588" text-anchor="middle">10 z khác nhau → 10 C(z)</text>

  <path class="arrow" d="M295 340 H365"/>
  <rect class="box" x="365" y="175" width="280" height="330" fill="#fef3c7"/>
  <text class="t b" x="505" y="214" text-anchor="middle">Đặt ngưỡng κ = 0.5</text>
  <text class="t s" x="505" y="250" text-anchor="middle">Kiểm tra C(zᵢ) ≤ 0.5</text>
  <g class="t b">
    <text x="415" y="300" fill="#16a34a">0.05 ✓</text><text x="535" y="300" fill="#16a34a">0.12 ✓</text>
    <text x="415" y="345" fill="#16a34a">0.18 ✓</text><text x="535" y="345" fill="#16a34a">0.31 ✓</text>
    <text x="415" y="390" fill="#16a34a">0.42 ✓</text><text x="535" y="390" fill="#dc2626">0.54 ✗</text>
    <text x="415" y="435" fill="#dc2626">0.62 ✗</text><text x="535" y="435" fill="#dc2626">0.76 ✗</text>
    <text x="415" y="480" fill="#dc2626">0.88 ✗</text><text x="535" y="480" fill="#dc2626">0.96 ✗</text>
  </g>

  <path class="arrow" d="M645 340 H715"/>
  <rect class="box" x="715" y="120" width="440" height="440" fill="#f0fdf4"/>
  <text class="t b" x="935" y="165" text-anchor="middle">Empirical coverage</text>
  <text class="t s" x="935" y="205" text-anchor="middle">5 ground truth nằm trong vùng 50%</text>
  <text class="t h" x="935" y="255" text-anchor="middle" fill="#16a34a">5 / 10 = 0.5</text>
  <line x1="775" y1="305" x2="1095" y2="305" stroke="#cbd5e1" stroke-width="2"/>
  <text class="t b" x="935" y="350" text-anchor="middle">Điểm calibration</text>
  <text class="t h" x="935" y="398" text-anchor="middle">(κ, coverage) = (0.5, 0.5)</text>
  <text class="t s" x="935" y="440" text-anchor="middle">Nằm trên đường lý tưởng y = x</text>
  <text class="t b" x="935" y="500" text-anchor="middle" fill="#16a34a">Calibration error = 0</text>

  <rect class="box" x="365" y="590" width="790" height="75" fill="#fff"/>
  <text class="t b" x="760" y="620" text-anchor="middle">Nếu có 7/10 giá trị C(z) ≤ 0.5: coverage = 0.7</text>
  <text class="t b" x="760" y="650" text-anchor="middle" fill="#dc2626">error = |0.7 − 0.5| = 0.2 → thường underconfident / quá rộng</text>
</svg>
