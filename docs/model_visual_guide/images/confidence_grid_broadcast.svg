<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <marker id="arr-grid" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.t{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:25px;font-weight:700}.b{font-size:18px}.s{font-size:14px}.box{stroke:#334155;stroke-width:2;rx:12}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arr-grid)}.cell{stroke:#94a3b8;stroke-width:1}</style>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text class="t h" x="600" y="38" text-anchor="middle">Một horizon: so mật độ 1000 samples với 130,321 grid points</text>

  <rect class="box" x="35" y="85" width="250" height="155" fill="#dcfce7"/>
  <text class="t b" x="160" y="122" text-anchor="middle">Monte Carlo samples</text>
  <text class="t s" x="160" y="154" text-anchor="middle">1000 điểm từ cùng GMM</text>
  <text class="t s" x="160" y="185" text-anchor="middle">log p(sample)</text>
  <text class="t b" x="160" y="218" text-anchor="middle">[1000, 1, 6]</text>

  <rect class="box" x="35" y="310" width="250" height="155" fill="#dbeafe"/>
  <text class="t b" x="160" y="347" text-anchor="middle">Grid points</text>
  <text class="t s" x="160" y="379" text-anchor="middle">361 × 361 tọa độ</text>
  <text class="t s" x="160" y="410" text-anchor="middle">log p(grid point)</text>
  <text class="t b" x="160" y="443" text-anchor="middle">[130321, 6]</text>

  <path class="arrow" d="M285 165 C350 165 340 255 405 255"/>
  <path class="arrow" d="M285 388 C350 388 340 300 405 300"/>

  <rect class="box" x="405" y="105" width="380" height="350" fill="#ffffff"/>
  <text class="t b" x="595" y="140" text-anchor="middle">Ma trận so sánh tại một horizon</text>
  <text class="t s" x="595" y="168" text-anchor="middle">1 nếu p(sample) &gt; p(grid)</text>
  <text class="t s" x="470" y="205">grid 1</text><text class="t s" x="545" y="205">grid 2</text><text class="t s" x="620" y="205">grid 3</text><text class="t s" x="695" y="205">...</text>
  <text class="t s" x="420" y="245">s₁</text><text class="t s" x="420" y="295">s₂</text><text class="t s" x="420" y="345">...</text><text class="t s" x="414" y="395">s₁₀₀₀</text>
  <g>
    <rect class="cell" x="465" y="220" width="55" height="40" fill="#fee2e2"/><text class="t b" x="492" y="247" text-anchor="middle">0</text>
    <rect class="cell" x="520" y="220" width="55" height="40" fill="#dcfce7"/><text class="t b" x="547" y="247" text-anchor="middle">1</text>
    <rect class="cell" x="575" y="220" width="55" height="40" fill="#dcfce7"/><text class="t b" x="602" y="247" text-anchor="middle">1</text>
    <rect class="cell" x="630" y="220" width="90" height="40" fill="#f1f5f9"/><text class="t b" x="675" y="247" text-anchor="middle">…</text>
    <rect class="cell" x="465" y="270" width="55" height="40" fill="#fee2e2"/><text class="t b" x="492" y="297" text-anchor="middle">0</text>
    <rect class="cell" x="520" y="270" width="55" height="40" fill="#fee2e2"/><text class="t b" x="547" y="297" text-anchor="middle">0</text>
    <rect class="cell" x="575" y="270" width="55" height="40" fill="#dcfce7"/><text class="t b" x="602" y="297" text-anchor="middle">1</text>
    <rect class="cell" x="630" y="270" width="90" height="40" fill="#f1f5f9"/><text class="t b" x="675" y="297" text-anchor="middle">…</text>
    <rect class="cell" x="465" y="320" width="55" height="40" fill="#f1f5f9"/><text class="t b" x="492" y="347" text-anchor="middle">⋮</text>
    <rect class="cell" x="520" y="320" width="55" height="40" fill="#f1f5f9"/><text class="t b" x="547" y="347" text-anchor="middle">⋮</text>
    <rect class="cell" x="575" y="320" width="55" height="40" fill="#f1f5f9"/><text class="t b" x="602" y="347" text-anchor="middle">⋮</text>
    <rect class="cell" x="630" y="320" width="90" height="40" fill="#f1f5f9"/><text class="t b" x="675" y="347" text-anchor="middle">⋱</text>
    <rect class="cell" x="465" y="370" width="55" height="40" fill="#fee2e2"/><text class="t b" x="492" y="397" text-anchor="middle">0</text>
    <rect class="cell" x="520" y="370" width="55" height="40" fill="#fee2e2"/><text class="t b" x="547" y="397" text-anchor="middle">0</text>
    <rect class="cell" x="575" y="370" width="55" height="40" fill="#fee2e2"/><text class="t b" x="602" y="397" text-anchor="middle">0</text>
    <rect class="cell" x="630" y="370" width="90" height="40" fill="#f1f5f9"/><text class="t b" x="675" y="397" text-anchor="middle">…</text>
  </g>
  <text class="t b" x="595" y="440" text-anchor="middle">Shape: [1000, 130321, 6]</text>

  <path class="arrow" d="M785 280 H850"/>
  <rect class="box" x="850" y="165" width="315" height="230" fill="#fef3c7"/>
  <text class="t b" x="1007" y="205" text-anchor="middle">Cộng mỗi cột</text>
  <text class="t s" x="1007" y="240" text-anchor="middle">rồi chia cho 1000</text>
  <text class="t b" x="1007" y="285" text-anchor="middle">conf_map[g,t]</text>
  <text class="t s" x="1007" y="320" text-anchor="middle">tỷ lệ sample có density</text>
  <text class="t s" x="1007" y="347" text-anchor="middle">cao hơn grid point g</text>
  <text class="t b" x="1007" y="380" text-anchor="middle">[130321, 6]</text>

  <rect class="box" x="120" y="530" width="960" height="115" fill="#fae8ff"/>
  <text class="t b" x="600" y="565" text-anchor="middle">Không so khoảng cách giữa hai tọa độ</text>
  <text class="t s" x="600" y="598" text-anchor="middle">So mật độ: log p(sample) &gt; log p(grid point)</text>
  <text class="t s" x="600" y="625" text-anchor="middle">density cao → conf thấp → gần mode · density thấp → conf cao → gần đuôi</text>
  <text class="t s" x="600" y="678" text-anchor="middle">≈ 781,926,000 phép so sánh cho một pedestrian khi tính đủ 6 horizons</text>
</svg>
