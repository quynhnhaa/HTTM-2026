<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <style>.t{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:26px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.grid{stroke:#cbd5e1;stroke-width:1}</style>
  <rect width="1100" height="560" fill="#f8fafc"/><text class="t h" x="550" y="42" text-anchor="middle">Sharpness đo diện tích confidence region</text>
  <rect x="70" y="85" width="470" height="390" fill="#fff" stroke="#334155" stroke-width="2"/>
  <g class="grid"><path d="M117 85V475 M164 85V475 M211 85V475 M258 85V475 M305 85V475 M352 85V475 M399 85V475 M446 85V475 M493 85V475"/><path d="M70 124H540 M70 163H540 M70 202H540 M70 241H540 M70 280H540 M70 319H540 M70 358H540 M70 397H540 M70 436H540"/></g>
  <ellipse cx="305" cy="280" rx="180" ry="142" fill="#c4b5fd" opacity=".75" stroke="#7c3aed" stroke-width="3"/><ellipse cx="305" cy="280" rx="112" ry="83" fill="#86efac" opacity=".9" stroke="#16a34a" stroke-width="3"/><circle cx="305" cy="280" r="8" fill="#111827"/>
  <text class="t s" x="310" y="273">mode</text><text class="t b" x="380" y="195" fill="#16a34a">68%</text><text class="t b" x="470" y="130" fill="#7c3aed">95%</text>
  <rect x="620" y="105" width="410" height="315" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text class="t b" x="650" y="148">Ví dụ grid đơn giản</text><text class="t b" x="650" y="200">Diện tích mỗi ô: 0.01 m²</text><text class="t b" x="650" y="245" fill="#16a34a">Vùng 68%: 80 ô</text><text class="t b" x="650" y="278" fill="#16a34a">80 × 0.01 = 0.80 m²</text><text class="t b" x="650" y="330" fill="#7c3aed">Vùng 95%: 180 ô</text><text class="t b" x="650" y="363" fill="#7c3aed">180 × 0.01 = 1.80 m²</text><text class="t s" x="650" y="402">Vùng nhỏ = tập trung hơn</text>
  <text class="t b" x="550" y="520" text-anchor="middle">Sharpness nhỏ chỉ có ý nghĩa tốt khi reliability vẫn đạt yêu cầu.</text>
</svg>
