<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.t{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:26px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.box{stroke:#334155;stroke-width:2;rx:14}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text class="t h" x="600" y="42" text-anchor="middle">Từ đầu ra model đến các metric trong eval.py</text>
  <rect class="box" x="40" y="205" width="220" height="120" fill="#dbeafe"/>
  <text class="t b" x="150" y="245" text-anchor="middle">Model output</text><text class="t h" x="150" y="282" text-anchor="middle">[B, 48, 18]</text><text class="t s" x="150" y="309" text-anchor="middle">48 GMM, mỗi GMM 3 thành phần</text>
  <path class="line" d="M260 265 H350"/>
  <rect class="box" x="350" y="195" width="250" height="140" fill="#e0e7ff"/>
  <text class="t b" x="475" y="232" text-anchor="middle">Chọn 6 horizon</text><text class="t s" x="475" y="263" text-anchor="middle">0.8 · 1.6 · 2.4</text><text class="t s" x="475" y="288" text-anchor="middle">3.2 · 4.0 · 4.8 giây</text><text class="t b" x="475" y="319" text-anchor="middle">[B, 6, 18]</text>
  <path class="line" d="M600 225 C650 225 650 105 700 105"/><path class="line" d="M600 250 H700"/><path class="line" d="M600 280 C650 280 650 405 700 405"/><path class="line" d="M600 305 C635 305 655 500 700 500"/>
  <rect class="box" x="700" y="65" width="450" height="80" fill="#dcfce7"/><text class="t b" x="720" y="98">Lấy 20 mẫu</text><text class="t s" x="720" y="127">→ minADE20, minFDE20: best-of-20</text>
  <rect class="box" x="700" y="190" width="450" height="110" fill="#fef3c7"/><text class="t b" x="720" y="224">Confidence tại ground truth</text><text class="t s" x="720" y="253">1000 Monte Carlo samples</text><text class="t s" x="720" y="280">→ Reliability: Ravg, Rmin</text>
  <rect class="box" x="700" y="350" width="450" height="110" fill="#fae8ff"/><text class="t b" x="720" y="384">Confidence trên grid 361 × 361</text><text class="t s" x="720" y="413">Vùng C(z) ≤ 0.68 / 0.95</text><text class="t s" x="720" y="440">→ Sharpness: S68, S95</text>
  <rect class="box" x="700" y="480" width="450" height="65" fill="#fee2e2"/><text class="t b" x="720" y="508">Mode = argmin confidence trên grid</text><text class="t s" x="720" y="533">→ AEE và ASAEE</text>
</svg>
